<body>
<div class="card">

<h1>⚙️ Panel de Administración</h1>

<p>

Desde aquí administrarás los empleados y los regalos.

</p>

<button id="btnImportar">
Importar empleados
</button>

<input type="file" id="archivoExcel" accept=".xlsx,.xls">

<p id="estado"></p>

<script type="module">

console.log("Admin cargado correctamente");

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD66UK6V-DIqTWi6gxEwS4gEoWQwtV9Cu0",
  authDomain: "regalos-cumple-2049e.firebaseapp.com",
  projectId: "regalos-cumple-2049e",
  storageBucket: "regalos-cumple-2049e.firebasestorage.app",
  messagingSenderId: "567466936945",
  appId: "1:567466936945:web:950dc46eb1ce858644e9d0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
document.getElementById("btnImportar").onclick = function () {
    
    importarExcel();
};

async function importarExcel() {

    const archivo = document.getElementById("archivoExcel").files[0];

    if (!archivo) {
        alert("Selecciona un archivo de Excel.");
        return;
    }

    const reader = new FileReader();

    reader.onload = async function(e){

        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data,{type:"array"});
        const hoja = workbook.Sheets[workbook.SheetNames[0]];
        const empleados = XLSX.utils.sheet_to_json(hoja);
      alert(Object.keys(empleados[0]).join("\n"));
      return;
      alert(JSON.stringify(empleados[10]));
       for (const emp of empleados) {
    
    await addDoc(collection(db, "empleados"), {
       numero: String(emp["No. pers."] || "").trim(),
        nombre: emp["Nombre del empleado o candidat"] || "",
        puesto: emp["Posición"] || "",
        nacimiento: emp["Fe.nacim."] || "",
        sexo: emp["Sexo"] || "",
        regalo: "",
        caja: "",
        recogido: false
    });

}

alert("Se importaron " + empleados.length + " empleados correctamente.");

    };

    reader.readAsArrayBuffer(archivo);

}
</script>  
</body>
