<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard - Regalos Sigma</title>

<style>

body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
margin:0;
padding:25px;
}

h1{
color:#0054A6;
text-align:center;
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:35px;
}

.card{
background:white;
border-radius:15px;
padding:25px;
text-align:center;
box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.card h2{
font-size:40px;
margin:10px 0;
color:#d71920;
}

.card p{
font-size:18px;
margin:0;
font-weight:bold;
}

table{
width:100%;
background:white;
border-collapse:collapse;
border-radius:12px;
overflow:hidden;
box-shadow:0 3px 12px rgba(0,0,0,.12);
margin-top:20px;
}

th{
background:#0054A6;
color:white;
padding:12px;
}

td{
padding:10px;
border-bottom:1px solid #eee;
}
</style>
</head>
<body>
<h1>📊 Dashboard Regalos Sigma</h1>
<div class="grid">

<div class="card">
<p>👥 Empleados</p>
<h2 id="emp">0</h2>
</div>

<div class="card">
<p>🎁 Regalos disponibles</p>
<h2 id="disp">0</h2>
</div>
<div class="card">
<p>🎂 Regalos elegidos</p>
<h2 id="elegidos">0</h2>
</div>
<div class="card">
<p>✅ Entregados</p>
<h2 id="entregados">0</h2>
</div>
</div>
  <div style="margin:20px 0;">
    <input
        type="text"
        id="buscar"
        placeholder="🔎 Buscar empleado, regalo o caja..."
        style="width:100%;max-width:450px;padding:12px;font-size:16px;border-radius:8px;border:1px solid #ccc;">
</div>
<h2>Pendientes por entregar</h2>
<table>
<thead>
<tr>
<th>Empleado</th>
<th>Regalo</th>
<th>Caja</th>
</tr>
</thead>
<tbody id="pendientes">
</tbody>
</table>

  <br><br>

<button id="descargarExcel">
📥 Descargar reporte Excel
</button>
  
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

 firebaseConfig = {
apiKey:"AIzaSyD66UK6V-DIqTWi6gxEwS4gEoWQwtV9Cu0",
authDomain:"regalos-cumple-2049e.firebaseapp.com",
projectId:"regalos-cumple-2049e",
storageBucket:"regalos-cumple-2049e.firebasestorage.app",
messagingSenderId:"567466936945",
appId:"1:567466936945:web:950dc46eb1ce858644e9d0"
};

 app = initializeApp(firebaseConfig);
 db = getFirestore(app);

cargarDashboard();

async function cargarDashboard(){

 empleados = await getDocs(collection(db,"empleados"));
 regalos = await getDocs(collection(db,"regalos"));

let totalEmp = 0;
let disponibles = 0;
let elegidos = 0;
let entregados = 0;

const tabla = document.getElementById("pendientes");
tabla.innerHTML = "";

const nombres = {};
  
empleados.forEach((doc)=>{
const emp = doc.data();
  nombres[emp.numero] = emp.nombre;

totalEmp++;

if(emp.regalo){
elegidos++;
}

if(emp.recogido){
entregados++;
}else if(emp.regalo){

tabla.innerHTML += `
<tr>
<td>${emp.nombre}</td>
<td>${emp.regalo}</td>
<td>${emp.caja}</td>
</tr>
`;

}

});
const tablaCajas = document.querySelector("#tablaCajas tbody");
  
regalos.forEach((doc)=>{

    const reg = doc.data();

    if(reg.disponible){
        disponibles++;
    }

    let estado = "🟢 Disponible";

    if(!reg.disponible && reg.elegidoPor!=""){
        estado = "🟡 Pendiente";
    }

    tablaCajas.innerHTML += `
    <tr>
        <td>${reg.numero}</td>
        <td>${reg.regalo}</td>
        <td>${estado}</td>
        <td>${nombres[reg.elegidoPor] || "-"}</td>
    </tr>
    `;

});

document.getElementById("emp").innerHTML = totalEmp;
document.getElementById("disp").innerHTML = disponibles;
document.getElementById("elegidos").innerHTML = elegidos;
document.getElementById("entregados").innerHTML = entregados;
  document.getElementById("descargarExcel").onclick = descargarExcel;

function descargarExcel(){

    const datos = [];

    document.querySelectorAll("#tablaCajas tbody tr").forEach(fila=>{

        const celdas = fila.querySelectorAll("td");

        datos.push({
            Caja: celdas[0].innerText,
            Regalo: celdas[1].innerText,
            Estado: celdas[2].innerText,
            Empleado: celdas[3].innerText
        });

    });

    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(datos);

    XLSX.utils.book_append_sheet(wb, ws, "Regalos");

    XLSX.writeFile(wb, "Reporte_Regalos.xlsx");

}

}
document.getElementById("buscar").addEventListener("keyup", function(){
    const texto = this.value.toLowerCase();
    document.querySelectorAll("#tablaCajas tbody tr").forEach(fila=>{
        if(fila.innerText.toLowerCase().includes(texto)){
            fila.style.display="";
        }else{
            fila.style.display="none";
        }

    });

});
</script>

</body>
</html>
