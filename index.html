<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regalos Cumpleaños Sigma</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    text-align:center;
    margin:0;
    padding:30px;
}

h1{
    color:#0054A6;
}

input{
    padding:12px;
    font-size:18px;
    width:220px;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    margin-top:15px;
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:8px;
    background:#d71920;
    color:white;
    cursor:pointer;
}

#regalos{
    margin-top:30px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.caja{
    background:#d71920;
    color:white;
    font-size:50px;
    padding:25px;
    border-radius:12px;
    cursor:pointer;
}

.oculto{
    display:none;
}
</style>

</head>

<body>

<h1>🎂 Regalos de Cumpleaños Sigma</h1>

<div id="login">
<p>Ingresa tu número de empleado</p>

<input id="numero">

<br>

<button onclick="entrar()">Entrar</button>

</div>

<div id="regalos" class="oculto">

<div class="caja">🎁</div>
<div class="caja">🎁</div>
<div class="caja">🎁</div>
<div class="caja">🎁</div>
<div class="caja">🎁</div>
<div class="caja">🎁</div>
<div class="caja">🎁</div>
<div class="caja">🎁</div>
<div class="caja">🎁</div>
<div class="caja">🎁</div>
<div class="caja">🎁</div>
<div class="caja">🎁</div>

</div>

<script>

function entrar(){

let numero=document.getElementById("numero").value;

if(numero==""){
    alert("Escribe tu número de empleado");
    return;
}

document.getElementById("login").classList.add("oculto");
document.getElementById("regalos").classList.remove("oculto");

}

</script>

</body>
</html>
