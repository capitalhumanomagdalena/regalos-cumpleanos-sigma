<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Regalos Sigma</title>

<style>
body{
font-family:Arial;
background:#f4f7fb;
text-align:center;
padding:40px;
}

h1{
color:#004b8d;
}

.grid{
display:grid;
grid-template-columns:repeat(4,80px);
gap:15px;
justify-content:center;
margin-top:40px;
}

.caja{
width:80px;
height:80px;
background:#e53935;
border-radius:10px;
display:flex;
justify-content:center;
align-items:center;
font-size:40px;
cursor:pointer;
transition:.3s;
}

.caja:hover{
transform:scale(1.08);
}
</style>

</head>

<body>

<h1>🎂 Regalos de Cumpleaños Sigma</h1>

<p>Selecciona una caja sorpresa.</p>

<div class="grid">

<div class="caja">🎁</div>

<div class="caja">🎁</div>

</div>

</body>
</html>
