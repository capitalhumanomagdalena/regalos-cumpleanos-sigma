<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regalos Cumpleaños Sigma</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}
body{
background:#f3f6fb;
padding:25px;
text-align:center;
}
h1{
color:#0054A6;
margin-bottom:15px;
}
p{
margin-bottom:20px;
}
input{
width:260px;
padding:12px;
font-size:18px;
border-radius:8px;
border:1px solid #ccc;
}
button{
background:#d71920;
color:white;
border:none;
padding:12px 30px;
font-size:18px;
border-radius:8px;
margin-top:15px;
cursor:pointer;
}

button:hover{
background:#b9141b;
}

.oculto{
display:none;
}

#regalos{
margin-top:30px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
gap:15px;
}

.caja{
background:#d71920;
border-radius:12px;
padding:20px;
cursor:pointer;
font-size:45px;
transition:.30s;
}

.caja:hover{
transform:scale(1.05);
}

</style>
</head>
<body>
<h1>🎂 Regalos de Cumpleaños Sigma</h1>
<p>

Ingresa tu número de empleado
</p>
<div id="login">
<input
id="numero"
placeholder="Número de empleado">
<br>
<button id="btnEntrar">

Entrar
</button>
</div>
<div
id="regalos"
class="oculto">
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
getFirestore,
collection,
getDocs,
doc,
updateDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const firebaseConfig = {
apiKey: "AIzaSyD66UK6V-DIqTWi6gxEwS4gEoWQwtV9Cu0",
authDomain: "regalos-cumple-2049e.firebaseapp.com",
projectId: "regalos-cumple-2049e",
storageBucket: "regalos-cumple-2049e.firebasestorage.app",
messagingSenderId: "567466936945",
appId: "1:567466936945:web:950dc46eb1ce858644e9d0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let empleados = [];
async function cargarEmpleados() {

    const snapshot = await getDocs(collection(db, "empleados"));
    empleados = [];
    snapshot.forEach((documento) => {
    empleados.push({
        id: documento.id,
        ...documento.data()
    });
});
    alert("Se cargaron " + empleados.length + " empleados.");
    console.log(empleados);
}

cargarEmpleados();

const btnEntrar=document.getElementById("btnEntrar");
const login=document.getElementById("login");
const regalos=document.getElementById("regalos");
btnEntrar.addEventListener("click",entrar);
async function entrar() {
    let numero = document.getElementById("numero").value.trim();

    alert("Empleados cargados: " + empleados.length);

    const empleado = empleados.find(e => String(e.numero).trim() === numero);

    if (!empleado) {
        alert("No encontrado");
        return;
    }

    alert("Encontrado: " + empleado.nombre);
if(empleado.regalo!=""){

    alert("Ya elegiste tu regalo:\n\n"+empleado.regalo);

    return;

}
    login.classList.add("oculto");
    regalos.classList.remove("oculto");
    await cargarRegalos(empleado);
}
async function cargarRegalos(empleado){

    regalos.innerHTML="";

    const consulta = await getDocs(collection(db,"regalos"));

    consulta.forEach((documento)=>{

        const datos=documento.data();

        if(!datos.disponible) return;

        if(datos.categoria!==empleado.sexo) return;

        const caja=document.createElement("div");
        caja.className="caja";
        caja.innerHTML="🎁";

        caja.onclick=async()=>{

            if(!confirm("¿Deseas elegir este regalo? Esta acción no se puede deshacer.")){
                return;
            }

            await updateDoc(doc(db,"regalos",documento.id),{
                disponible:false,
                elegidoPor:empleado.numero
            });

            const empleadosDB=await getDocs(collection(db,"empleados"));
            empleadosDB.forEach(async(empDoc)=>{
                const emp=empDoc.data();
                if(String(emp.numero)===String(empleado.numero)){
                    await updateDoc(doc(db,"empleados",empDoc.id),{
    regalo: datos.regalo,
    caja: datos.numero,
    recogido: false
});
                }
            });

            alert("¡Tu regalo quedó registrado!\n\n"+datos.regalo);

            login.classList.add("oculto");
regalos.innerHTML = "<h2>✅ Ya elegiste tu regalo</h2><p>" + empleado.regalo + "</p>";
regalos.classList.remove("oculto");

        };

        regalos.appendChild(caja);

    });

}
</script>
</body>
</html>
